[project]
name = "ingest-api"
version = "0.1.0"
description = "Generic ingest API for a home-lab Postgres store"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2",
    "pydantic-settings",
    "pyyaml",
    "typer",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs a Postgres+TimescaleDB admin DSN in TEST_ADMIN_DSN"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
