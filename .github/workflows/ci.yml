name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ingest-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg17
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: ingest-api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        if: hashFiles('ingest-api/pyproject.toml') != ''
      - if: hashFiles('ingest-api/pyproject.toml') != ''
        run: uv sync --locked
      - if: hashFiles('ingest-api/pyproject.toml') != ''
        run: uv run ruff check .
      - if: hashFiles('ingest-api/pyproject.toml') != ''
        run: uv run pytest -q
        env:
          TEST_ADMIN_DSN: postgresql://postgres:ci@localhost:5432/postgres

  image-check:
    if: github.event_name == 'pull_request'
    needs: ingest-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ingest-api
          push: false
          load: true
          tags: ingest-api:pr-${{ github.event.pull_request.number }}
      - name: Smoke-test the image
        run: |
          IMG=ingest-api:pr-${{ github.event.pull_request.number }}
          docker run --rm "$IMG" store-admin --help
          docker run --rm "$IMG" python -c "import ingest_api, pathlib; files = list((pathlib.Path(ingest_api.__file__).parent/'store_migrations').glob('*.sql')); print(files); assert files"

  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ingest-api
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ingest-api
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/jamilcpu/ingest-api:${{ github.sha }}
            ghcr.io/jamilcpu/ingest-api:latest
